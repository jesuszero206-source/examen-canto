services:
  - type: web
    name: cafe-aurora
    env: php
    buildCommand: "./build.sh"
    # El entorno PHP de Render utiliza Apache.
    # No se requiere un startCommand personalizado si la carpeta webroot se establece en public.
    # Render detectará public/ automáticamente o se puede configurar en el Dashboard.
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: LOG_CHANNEL
        value: errorlog
      - key: CACHE_STORE
        value: database
      - key: SESSION_DRIVER
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: DB_CONNECTION
        value: mysql
      - key: APP_KEY
        sync: false
